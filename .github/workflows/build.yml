name: build

# Every push to master runs semantic-release (conventional commits -> next version, git tag,
# GitHub release), then builds the Docker image and pushes it to ghcr.io.
# One workflow, because tags created with GITHUB_TOKEN do not trigger other workflows.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A quick gate: every Python file compiles and every page script parses.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Python compiles
        run: python3 -m compileall -q app run.py

      - name: Page scripts parse
        run: for f in app/static/*.js; do node --check "$f"; done

  release:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes semantic-release@25

      # Empty when there was nothing to release (only chore/docs/ci/etc. commits).
      # Reading the tag on HEAD (instead of parsing semantic-release output) also makes re-runs work.
      - name: Resolve released version
        id: version
        run: |
          git fetch --tags --force
          tag="$(git tag --points-at HEAD --list 'v[0-9]*' | sort -V | tail -1)"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  image:
    needs: [check, release]
    # Only pushes to master build and publish the image; pull requests skip it.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.check.result == 'success' && needs.release.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name (ghcr.io requires it).
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.version != '' }}
          labels: |
            org.opencontainers.image.version=${{ needs.release.outputs.version || github.sha }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
